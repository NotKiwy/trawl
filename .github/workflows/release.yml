name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: trawl
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: trawl
            archive: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: trawl
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: trawl
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: trawl.exe
            archive: zip

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build (native)
        if: '!matrix.cross'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          _binary="target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          _name="trawl-${{ matrix.target }}"
          mkdir -p dist
          cp "$_binary" dist/trawl
          tar -czvf "dist/${_name}.tar.gz" -C dist trawl
          rm dist/trawl

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $binary = "target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          $name = "trawl-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item $binary dist/trawl.exe
          Compress-Archive -Path dist/trawl.exe -DestinationPath "dist/${name}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: trawl-${{ matrix.target }}
          path: dist/*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
